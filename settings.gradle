pluginManagement {
    includeBuild('build-logic')
    repositories {
        gradlePluginPortal()
    }
    plugins {
        id 'org.springframework.boot' version "${springBootVersion}"
        id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention'
}

rootProject.name = 'pet-feed'

// 개별 의존성 주입 실패시 중앙 집권
dependencyResolutionManagement {
    repositoriesMode = RepositoriesMode.FAIL_ON_PROJECT_REPOS
    repositories {
        mavenCentral()
    }
}

// Shared 모듈 (공통 라이브러리)
include ':api-contracts'
project(':api-contracts').projectDir = file('shared/api-contracts')

include ':common-infrastructure'
project(':common-infrastructure').projectDir = file('shared/common-infrastructure')

// Services 모듈 (비즈니스 서비스)
include ':member-service'
project(':member-service').projectDir = file('services/member-service')

include ':post-service'
project(':post-service').projectDir = file('services/post-service')

include ':comment-service'
project(':comment-service').projectDir = file('services/comment-service')

include ':follow-service'
project(':follow-service').projectDir = file('services/follow-service')

include ':media-service'
project(':media-service').projectDir = file('services/media-service')

// Apps 모듈 (애플리케이션)
include ':api-gateway'
project(':api-gateway').projectDir = file('apps/api-gateway')

include ':facade'
project(':facade').projectDir = file('apps/facade')
