spring:
  application:
    name: post-service
  datasource:
    url: jdbc:h2:mem:postdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

server:
  port: 8082

comment-service:
  url: ${COMMENT_SERVICE_URL:http://localhost:8084}
post:
  cleanup:
    enabled: true
    poll-delay-ms: 5000
